name: Deploy to Fabric Test Workspaces

# Landing and Bronze are separate Fabric workspaces, so this repo has two deploy jobs — the
# same shape as ms-fabric-dd-trip-data's silver/gold split.
#
# Both jobs share one repository-directory (and therefore one parameter.yml); `items-to-include`
# decides which items each publishes. The two lists together must cover every item in
# datasource_nyc_taxi, or the uncovered ones are silently never deployed.
#
# Bronze waits on Landing: landing_bronze_copy_job's source resolves lh_landing_nyc_taxi by
# name in the Landing workspace, so that lakehouse must exist first.
on:
  workflow_dispatch: {}

jobs:
  deploy-landing:
    uses: vtiyer89/ms-fabric-platform-core/.github/workflows/deploy-fabric-item.yml@main
    with:
      workspace-id: ${{ vars.TEST_LANDING_WORKSPACE_ID }}
      environment-name: TEST
      repository-directory: datasource_nyc_taxi
      items-in-scope: "Lakehouse,DataPipeline,CopyJob"
      items-to-include: "lh_landing_nyc_taxi.Lakehouse,pl_landing_nyc_ingest.DataPipeline"
    secrets: inherit

  deploy-bronze:
    needs: deploy-landing
    uses: vtiyer89/ms-fabric-platform-core/.github/workflows/deploy-fabric-item.yml@main
    with:
      workspace-id: ${{ vars.TEST_BRONZE_WORKSPACE_ID }}
      environment-name: TEST
      repository-directory: datasource_nyc_taxi
      items-in-scope: "Lakehouse,DataPipeline,CopyJob"
      items-to-include: "lh_bronze_nyc_taxi.Lakehouse,pl_bronze_nyc_taxi.DataPipeline,landing_bronze_copy_job.CopyJob"
      # Connection IDs — the only parameter.yml values that can't resolve live.
      # FABRIC_PARAM_<NAME> becomes $ENV:<NAME> inside parameter.yml.
      # Pass repo Variables here, never Secrets: these values appear in workflow logs.
      parameter-env-vars: |
        FABRIC_PARAM_DEV_COPY_JOB_CONNECTION_ID=${{ vars.DEV_COPY_JOB_CONNECTION_ID }}
        FABRIC_PARAM_TEST_COPY_JOB_CONNECTION_ID=${{ vars.TEST_COPY_JOB_CONNECTION_ID }}
    secrets: inherit
