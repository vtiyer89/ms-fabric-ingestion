# fabric-cicd parameterization for the "Ingestion" workspace
# (landing lakehouse, bronze lakehouse, landing/bronze pipelines, bronze copy job)
#
# Environments: DEV (current hardcoded values, kept here for documentation/debug_parameterization.py),
#               TEST (fill in the placeholders below once the Test workspace + its items exist)
#
# See docs/fabric-test-workspace-sync.md for how to obtain each TEST value.

find_replace:
    # --- pl_bronze_nyc_taxi's two Lookup activities: connection to platform-core's SQL database ---
    # metadata-driven POC (see ms-fabric-platform-core/docs/metadata-db-mapping.md and
    # scripts/seed_metadata_db.py). Connections are tenant objects, not Fabric items, so no
    # $workspace/$items variable reaches them — supplied as GitHub repo Variables via
    # FABRIC_PARAM_<NAME> (see scripts/deploy_fabric_item.py), same pattern the old CopyJob
    # connection used. "deadbeef-0000-0000-0000-000000000001" is a placeholder sentinel — no such
    # connection exists in Dev yet (there is no Dev platform workspace either, see CLAUDE.md
    # Known-unverified), so DEV deliberately leaves it unresolved. TEST must be created for real
    # and TEST_PLATFORM_METADATA_DB_CONNECTION_ID set to match before this pipeline can run there.
    - find_value: "deadbeef-0000-0000-0000-000000000001"
      replace_value:
          DEV: "deadbeef-0000-0000-0000-000000000001"
          TEST: "$ENV:TEST_PLATFORM_METADATA_DB_CONNECTION_ID"
      item_type: "DataPipeline"
      item_name: "pl_bronze_nyc_taxi"

    # --- cp_landing_to_bronze's source: the LANDING workspace's landing lakehouse ---
    # Still deploy-time identity (which physical lakehouse holds the parquet file) — unlike the
    # destination below, which is now resolved at run time from TargetStoreConfig and needs no
    # find_replace rule at all. This is a genuine cross-workspace reference: pl_bronze_nyc_taxi is
    # published by the bronze job, but its source is the Landing workspace. These resolve live,
    # so Landing must deploy first — `needs: deploy-landing` in the caller workflow enforces that.
    - find_value: "37f9f143-c972-45c2-9ae6-995b7639dff5"
      replace_value:
          DEV: "37f9f143-c972-45c2-9ae6-995b7639dff5"
          TEST: "$workspace.ws-test-landing-rjoose-v2.$id"
      item_type: "DataPipeline"
      item_name: "pl_bronze_nyc_taxi"

    - find_value: "95e9be52-6ce5-4912-9264-d8c101939c5f"
      replace_value:
          DEV: "95e9be52-6ce5-4912-9264-d8c101939c5f"
          TEST: "$workspace.ws-test-landing-rjoose-v2.$items.Lakehouse.lh_landing_nyc_taxi.$id"
      item_type: "DataPipeline"
      item_name: "pl_bronze_nyc_taxi"
