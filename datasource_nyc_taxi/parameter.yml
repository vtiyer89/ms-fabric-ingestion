# fabric-cicd parameterization for the "Ingestion" workspace
# (landing lakehouse, bronze lakehouse, landing/bronze pipelines, bronze copy job)
#
# Environments: DEV (current hardcoded values, kept here for documentation/debug_parameterization.py),
#               TEST (fill in the placeholders below once the Test workspace + its items exist)
#
# See docs/fabric-test-workspace-sync.md for how to obtain each TEST value.

find_replace:
    # --- Connection used by pl_bronze_nyc_taxi's InvokeCopyJob activity ---
    # Connections are tenant objects, not Fabric items, so no $workspace/$items variable
    # reaches them — these are the only values here that can't resolve live. Supplied instead
    # as GitHub repo Variables via FABRIC_PARAM_<NAME> (see scripts/deploy_fabric_item.py).
    # DEV_COPY_JOB_CONNECTION_ID must match the GUID actually present in the item JSON, or the
    # rule silently matches nothing — the deploy script asserts this before publishing.
    - find_value: "$ENV:DEV_COPY_JOB_CONNECTION_ID"
      replace_value:
          DEV: "$ENV:DEV_COPY_JOB_CONNECTION_ID"
          TEST: "$ENV:TEST_COPY_JOB_CONNECTION_ID"
      item_type: "DataPipeline"
      item_name: "pl_bronze_nyc_taxi"

    # --- landing_bronze_copy_job destination: the BRONZE workspace's own bronze lakehouse ---
    # Still a self-reference: the copy job is published by the bronze job, so $workspace.$id
    # is the Bronze workspace.
    - find_value: "3ab4eb52-fcd3-48e0-a92c-3e3feb437a79"
      replace_value:
          _ALL_: "$workspace.$id"
      item_type: "CopyJob"
      item_name: "landing_bronze_copy_job"

    - find_value: "0bd61d00-d794-4351-8791-faeb94879e25"
      replace_value:
          _ALL_: "$items.Lakehouse.lh_bronze_nyc_taxi.$id"
      item_type: "CopyJob"
      item_name: "landing_bronze_copy_job"

    # --- landing_bronze_copy_job source: the LANDING workspace's landing lakehouse ---
    # The copy job is published by the bronze job, so its source is now a genuine
    # cross-workspace reference rather than a self-reference. The source/destination workspace
    # mismatch in the Dev export turns out to be correct: landing and bronze really are
    # separate workspaces. These resolve live, so the Landing workspace must deploy first —
    # `needs: deploy-landing` in the caller workflow enforces that.
    - find_value: "37f9f143-c972-45c2-9ae6-995b7639dff5"
      replace_value:
          DEV: "37f9f143-c972-45c2-9ae6-995b7639dff5"
          TEST: "$workspace.ws-test-landing-rjoose-v2.$id"
      item_type: "CopyJob"
      item_name: "landing_bronze_copy_job"

    - find_value: "95e9be52-6ce5-4912-9264-d8c101939c5f"
      replace_value:
          DEV: "95e9be52-6ce5-4912-9264-d8c101939c5f"
          TEST: "$workspace.ws-test-landing-rjoose-v2.$items.Lakehouse.lh_landing_nyc_taxi.$id"
      item_type: "CopyJob"
      item_name: "landing_bronze_copy_job"
