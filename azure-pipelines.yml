# Deploy ms-fabric-ingestion to the Fabric Test workspaces (Azure DevOps).
#
# Landing and Bronze are separate Fabric workspaces, so this pipeline has two jobs — the same
# shape as ms-fabric-dd-trip-data's silver/gold split. Each job now owns its own directory
# (datasource_nyc_taxi/bronze, datasource_nyc_taxi/landing) and publishes everything in it — no
# itemsToInclude list, so nothing here is artifact-name dependent.
#
# Landing waits on Bronze. pl_master_landing (in Landing) invokes pl_bronze_nyc_taxi (in Bronze)
# via a cross-workspace InvokePipeline reference that resolves pl_bronze_nyc_taxi's live item
# GUID at deploy time, so Bronze must exist first. Neither pipeline has a static, deploy-time
# dependency on the other's lakehouse anymore — both source and destination for the actual copy
# are resolved at *run time* by pl_master_landing via metadata.usp_GetCopyJobConfig (see
# ms-fabric-platform-core/docs/metadata-db-mapping.md and
# platform/sql/005_create_usp_get_copy_config.sql).

trigger: none
pr: none

resources:
  repositories:
    - repository: platform-core
      type: git                                   # 'git' = Azure Repos. Use 'github' + a
      name: <YOUR-ADO-PROJECT>/ms-fabric-platform-core   # service connection if it stays on GitHub.
      ref: refs/heads/main

jobs:
  - template: pipelines/templates/deploy-fabric-item.yml@platform-core
    parameters:
      jobName: deploy_bronze
      jobDisplayName: "Deploy Bronze"
      variableGroups: [fabric-cicd-common, fabric-ingestion]
      workspaceId: $(TEST_BRONZE_WORKSPACE_ID)
      environmentName: TEST
      repositoryDirectory: datasource_nyc_taxi/bronze
      itemsInScope: "Lakehouse,DataPipeline"
      # pl_bronze_nyc_taxi has zero find_replace rules of its own — fully parameter-driven, both
      # source and destination resolved at run time by pl_master_landing. This directory has no
      # parameter.yml at all, so no parameterEnvVars are needed here.

  - template: pipelines/templates/deploy-fabric-item.yml@platform-core
    parameters:
      jobName: deploy_landing
      jobDisplayName: "Deploy Landing"
      dependsOn: [deploy_bronze]
      variableGroups: [fabric-cicd-common, fabric-ingestion]
      workspaceId: $(TEST_LANDING_WORKSPACE_ID)
      environmentName: TEST
      repositoryDirectory: datasource_nyc_taxi/landing
      itemsInScope: "Lakehouse,DataPipeline"
      # pl_master_landing needs both: the platform metadata DB connection (its two Lookups call
      # metadata.usp_GetCopyJobConfig) and pl_bronze_nyc_taxi's live item ID (its InvokePipeline
      # activity) — the latter is why this job depends on deploy_bronze above.
      parameterEnvVars:
        TEST_PLATFORM_METADATA_DB_CONNECTION_ID: $(TEST_PLATFORM_METADATA_DB_CONNECTION_ID)
